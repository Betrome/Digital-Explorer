name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: digital-explorer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk digital-explorer-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" digital-explorer-build-${{ github.run_number }}.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }} (${{ github.ref_name }})."
